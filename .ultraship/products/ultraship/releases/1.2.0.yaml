product: ultraship
version: 1.2.0
status: planned
release_type: minor
outcome:
  user_can: >
    Opt in to a commit policy and have their lifecycle work commit itself. With
    `commit_policy: checkpoint` in `ultraship.yaml`, the four working skills each call
    `ultraship commit <checkpoint>` at defined points: plan commits the roadmap and then the
    release contract; develop commits the generated task set, then every task the moment it
    reaches `done` with its evidence and its own declared files, and every checkpoint file;
    iterate commits the iteration record together with every canonical file the change touched;
    complete commits the captured evidence and then the immutable release record with its lock
    entry and version-file bumps. Each commit is a single conventional-format message derived
    from canonical state, not invented by the agent. The command is local-only — it stages and
    commits, and never pushes, branches, or tags, so the developer keeps the outward-facing
    steps. A workspace that does not set the policy behaves exactly as it does on 1.1.0.
  business_value: >
    Today a whole UltraShip release arrives as one undifferentiated working tree. The framework's
    central claim is that a release is a traceable record — the roadmap, the contract, the
    evidence, the immutable record — yet the version-control history, which is where every other
    developer actually reads that record, shows none of it. Nothing distinguishes the commit that
    specified the release from the commit that shipped it, a task's implementation cannot be
    reviewed or reverted on its own, and a long develop run that is interrupted loses everything
    not yet saved. Committing at the checkpoints the state model already defines turns git history
    into a second, independent view of the same canonical truth: reviewable per task, revertible
    per task, and resumable after any interruption. It also makes 1.3.0's parallel task execution
    safe to build, because each concurrent task needs its own commit boundary to be reviewable at
    all. Doing it as an opt-in field rather than a default keeps every existing 1.x workspace
    working unchanged, which is the compatibility guarantee this project sells.
  evidence_of_value: >
    `ultraship commit <checkpoint>` exists as the eleventh CLI command, is documented in
    docs/CONTRACT.md, and is exercised by tests covering: policy absent (no-op, exit 0), policy
    off (no-op, exit 0), nothing to commit (no-op, exit 0), not a git repository (no-op, exit 0),
    and a real commit whose message matches the derived conventional format. Running the five
    skills against this repository produces a git log in which the roadmap commit, the contract
    commit, each task commit, and the release-record commit are separately identifiable. The
    README carries CI, Node, version, and license badges and documents the policy.
    `npm test` passes and `ultraship validate` exits 0.
scope:
  included:
    - An optional `commit_policy` field in schemas/ultraship.schema.json — a string enum of `off` and `checkpoint`; absent means `off`, so every 1.0 and 1.1 workspace keeps its current behaviour and needs no migration
    - A new lib/commit.mjs implementing checkpoint commits — it reads the policy, resolves the paths for the named checkpoint through lib/paths.mjs, stages exactly those paths, derives a Conventional Commits message from canonical state, and commits; it never pushes, never creates a branch, and never creates a tag
    - An eleventh CLI command `ultraship commit <checkpoint> [product] [version]` dispatched from bin/ultraship.mjs, printing JSON to stdout like every other command and exiting non-zero only when a commit was required by the policy and git refused it
    - Silent, exit-0 no-op behaviour whenever the policy is off or absent, the directory is not a git repository, or the checkpoint's paths hold no changes — so enabling the feature can never break an unrelated workflow
    - A shared/commit-protocol.md naming every checkpoint, the paths it stages, and the message format, so the four skills reference one contract instead of restating a git recipe four times
    - Checkpoint calls added to skills/plan, skills/develop, skills/iterate, and skills/complete at the points shared/commit-protocol.md defines
    - Develop's task checkpoint stages the task's own `files` list from tasks.yaml alongside the updated tasks.yaml, so a task commit contains its implementation and its evidence together
    - Complete's release checkpoint runs after the record and .ultraship/releases.lock are written and after version_files are bumped, so the shipped commit is internally consistent
    - README badges — CI status, Node version, current version, and license — plus a README section documenting `commit_policy` and the commit command, and the command added to the README command table
    - Documentation brought fully in step — docs/CONTRACT.md lists eleven commands and notes `commit_policy` on the ultraship.schema row, docs/COMPATIBILITY.md records that the optional field is a minor addition needing no migration, CHANGELOG.md gains the 1.2.0 entry, and CONTRIBUTING.md plus docs/CONTRIBUTING-WITH-ULTRASHIP.md explain the commit protocol a contributor will now see running
    - test/commit.test.mjs covering policy absent, policy off, no changes, non-git directory, a real commit and its message format, and a migrate idempotency test proving a 1.1.0 workspace upgrades untouched
    - version_files bumped to 1.2.0 across package.json, .claude-plugin/plugin.json, and .claude-plugin/marketplace.json, and commit_policy set to `checkpoint` in this repository's own .ultraship/ultraship.yaml so UltraShip dogfoods the feature
  excluded:
    - Any push, branch creation, tag, or pull-request operation — outward-facing git stays the developer's authorized manual step and the CLI keeps its no-network guarantee
    - Making the policy default-on; that would change four skills' behaviour for existing workspaces and force a major version
    - A new `validate` check for uncommitted state — canonical state is legitimately dirty throughout develop, so a blanket check would break normal work; complete's gate is the failing `ultraship commit` exit code instead
    - Commit signing, hooks, message templating configuration, squashing, or amend behaviour
    - Parallel subagent task execution, which is 1.3.0
    - Retrofitting commits onto the brainstorm skill; product.yaml is written once and its commit is the developer's own
  fallback_scope:
    - The `commit_policy` field, lib/commit.mjs, the `ultraship commit` command with its no-op paths, shared/commit-protocol.md, checkpoint calls in develop and complete only, test/commit.test.mjs, the docs and README badge updates, and the version bump. Plan and iterate checkpoints are the deferrable extension — they commit one file each and a developer can commit those by hand. This still delivers a coherent outcome, because the two skills that produce the most untracked work commit it themselves, per task and per release record.
acceptance:
  functional:
    - schemas/ultraship.schema.json accepts an optional `commit_policy` string of `off` or `checkpoint`, rejects any other value, and validates a workspace that omits the field entirely
    - "`ultraship commit <checkpoint>` exits 0 and prints JSON reporting `committed: false` when the policy is absent, when it is `off`, when the checkpoint's paths hold no changes, and when the directory is not a git repository"
    - "`ultraship commit <checkpoint>` with the policy set to `checkpoint` creates exactly one commit containing only the paths that checkpoint declares, and prints the resulting commit SHA as JSON"
    - The commit message is a Conventional Commits subject derived from the product, version, and checkpoint in canonical state, and carries no co-author or tool-attribution trailer
    - "`ultraship commit` never runs `git push`, `git branch`, `git tag`, or any network operation, asserted by a test that inspects the git invocations the module makes"
    - shared/commit-protocol.md names every checkpoint, the paths it stages, and the message format, and skills/plan, skills/develop, skills/iterate, and skills/complete each call the checkpoints it defines
    - Develop's task checkpoint stages the completing task's `files` entries from tasks.yaml together with tasks.yaml itself
    - Complete's release checkpoint runs after the release record, .ultraship/releases.lock, and the version_files bumps are all written
    - README shows CI status, Node version, version, and license badges, documents `commit_policy`, and lists `ultraship commit` in the command table
    - docs/CONTRACT.md lists eleven CLI commands including `ultraship commit`, and docs/COMPATIBILITY.md records `commit_policy` as an optional minor addition requiring no migration
  non_functional:
    - A workspace written by 1.0.0 or 1.1.0 passes `ultraship validate` unchanged on 1.2.0 and behaves identically, because the absent field means `off`
    - "`ultraship migrate` remains forward-only and idempotent and adds no field to a workspace that omits `commit_policy`"
    - No runtime npm dependency is added; git is invoked through Node 20+ stdlib child_process only, and the vendored-parser zero-install guarantee holds
    - The CLI still makes no network call and still never calls a model
    - CHANGELOG.md and CONTRIBUTING.md describe the commit protocol accurately, and every path and command named in the documentation exists
  operational:
    - "`npm test` passes locally and in CI, including test/commit.test.mjs"
    - "`node bin/ultraship.mjs validate` exits 0 on this workspace"
    - version_files (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) all read 1.2.0 at release
    - This repository's .ultraship/ultraship.yaml sets `commit_policy` to `checkpoint`, so the release is developed and completed using the feature it ships
    - "`ultraship deploy` runs the declared published hook and records the GitHub release as deployment evidence"
delivery:
  target_mode: published
  environment: >
    The GitHub repository zeroonething/ultraship and the Claude Code plugin marketplace it is
    installed from. The CLI change is a new module, a new dispatch entry, and an optional schema
    field; there is no server and no hosted component.
  deployment_method: >
    Work on a feature branch, opened as a pull request and merged to main by the maintainer. After
    the merge, `ultraship deploy` runs the declared published delivery hook, which creates the
    GitHub release from the CHANGELOG entry and verifies it with the smoke command.
  migrations:
    - None required. `commit_policy` is optional and its absence means `off`, so a 1.0 or 1.1 workspace is already valid on 1.2.0. `ultraship migrate` gains no step and must stay idempotent, which a test asserts.
  observability:
    - The CI workflow's pass/fail on every pull request, plus npm test and ultraship validate, are the health checks
    - The git log of this repository is itself the running evidence — after this release, the roadmap, contract, task, and release commits are separately identifiable in UltraShip's own history
  rollback: >
    Revert the pull-request merge commit. The feature is inert in any workspace that does not set
    `commit_policy`, and setting it back to `off` disables it without any state to unwind — no
    canonical file shape changed and no released record is affected. Commits the feature already
    made are ordinary git history and stay valid after a revert.
dependencies:
  products: []
  services:
    - Git must be on PATH for the commit command to do anything; its absence is treated as the not-a-git-repository no-op, not an error
    - GitHub Actions for CI and the gh CLI for the published delivery hook, both already in use
  human_approvals:
    - The maintainer reviews and merges the pull request
    - The maintainer confirms the checkpoint list in shared/commit-protocol.md matches where they actually want commits to land
    - The maintainer authorizes the GitHub release, which stays a post-merge step
risks:
  - A commit protocol that stages too broadly could sweep a developer's unrelated working changes into an UltraShip commit. Mitigated by staging only the explicit paths each checkpoint declares — canonical files plus, for a task checkpoint, that task's own declared files — and never using a bare `git add -A`.
  - Making four skills invoke git turns a read-only state engine into something that writes to the developer's repository. Mitigated by the opt-in policy, by no-op-on-anything-unexpected behaviour, and by the hard exclusion of push, branch, and tag so nothing leaves the machine.
  - A task whose `files` list in tasks.yaml is wrong or incomplete produces a commit missing part of its implementation. Mitigated by the checkpoint reporting the staged paths in its JSON output, so a mismatch is visible rather than silent.
  - The four skills and shared/commit-protocol.md could drift out of step, which is the failure mode CLAUDE.md warns about for shared prose contracts. Mitigated by keeping the checkpoint list in one file and having the skills reference it rather than restate it.
  - Committing during develop interacts with the interrupted-work and checkpoint paths; a commit made while the repository is failing could record a broken state. Mitigated by the develop task checkpoint firing only when a task reaches `done` with recorded evidence, and by the existing checkpoint file recording `repository_state`.
resource_profile:
  complexity: medium
  uncertainty: low
  likely_cost_drivers:
    - Getting the no-op paths exhaustively right, since a spurious failure in a git-touching command would block every skill
    - Deciding the checkpoint list and message format once, in shared/commit-protocol.md, and threading it through four skills without restating it
    - Test coverage for git behaviour without leaving repositories behind or committing to this repository during the run
    - Bringing README, CONTRACT, COMPATIBILITY, CHANGELOG, and both contributing guides in step with an eleventh command
  preferred_tools:
    - Claude Code
  constraints:
    - Zero runtime npm dependencies; git is invoked through Node 20+ stdlib only
    - Node 20 or newer
    - The CLI never calls a model and never touches the network
    - No breaking change to the 1.0 public contract; the new command and the optional field are additive only
open_questions:
  - Exact checkpoint names and their granularity — whether develop commits per task only, or also per acceptance criterion. Leaning per task. Settled in shared/commit-protocol.md during develop, with the maintainer.
  - Whether the commit subject uses the checkpoint name as the Conventional Commits type (`plan:`, `develop:`) or a standard type with the checkpoint in the scope (`chore(plan):`). Leaning the latter for tooling compatibility. Decided in develop.
  - Whether `ultraship commit` takes the checkpoint as a positional argument or a `--checkpoint` flag, given every other command uses positionals. Leaning positional for consistency. Decided in develop.
  - Which badges the README carries beyond CI, Node, version, and license — a zero-dependencies badge is tempting but must be accurate. Decided in develop.
