product: ultraship
version: 2.1.0
status: planned
release_type: minor
outcome:
  user_can: >
    Ask for parallel work and get it, on their own terms. A sixth skill, `/ultraship:subagent`, is
    the one place UltraShip fans work out to concurrent agents. A developer reaches it three ways:
    they invoke `/ultraship:subagent` directly, they tell the running skill to use subagents for
    this flow, or they record the preference once — in their project instructions, in a memory
    file, or as `allow_parallel_agents: true` — and every later run picks it up. Nothing is
    parallel by default; with none of the three present, every skill runs exactly as it does on
    2.0.0. When it does activate, `/ultraship:develop` asks `ultraship wave` which tasks are
    provably independent — every dependency already `done`, declared `files` disjoint from every
    other task in the wave and from anything in progress — dispatches that wave, records each
    returned evidence against its task, commits each finished task through the existing
    `develop-task` checkpoint, and computes the next wave. `/ultraship:plan` uses the same skill
    for independent research briefs while drafting a roadmap or a contract. A subagent returns
    evidence and the files it actually changed and writes no canonical state, runs no transition,
    and makes no commit, so the calling skill remains the single owner of what is true about the
    release.
  business_value: >
    UltraShip's own thesis is that inference, time, and money are engineering resources. Today it
    spends them the slowest possible way: a release with eight independent tasks costs eight
    sequential passes through one agent, even when six of them touch entirely different files. The
    information needed to do better is already sitting in canonical state — `depends_on` and
    `files` are recorded on every task before any of them runs — and 2.0.0 already gave each task
    its own commit boundary, which is what makes concurrent work reviewable and revertible at all.
    Parallel dispatch is the payoff those two facts were building toward. Putting it in one skill
    rather than inlining it into develop is what keeps it honest: plan, iterate, and complete get
    the same protocol without four copies of a dispatch recipe drifting apart, and the rules a
    subagent must obey — no canonical writes, no commits, no transitions — live in one contract
    instead of being re-argued per call site. Shipping it default-off is what makes it safe.
    Concurrency changes who is watching when something goes wrong, and a framework that starts
    spawning agents in a developer's repository without being asked would repeat the exact mistake
    2.0.0 spent a major version absorbing. The developer turns it on, three ways, and one of them
    makes it permanent.
  evidence_of_value: >
    `skills/subagent/SKILL.md` exists and is listed in docs/CONTRACT.md under the supporting
    skills. `shared/subagent-protocol.md` states the activation precedence, the brief format, the
    return format, and the prohibitions, and `plan` and `develop` reference it rather than
    restating it. `ultraship wave` exists as the twelfth CLI command and is covered by
    test/wave.test.mjs across dependency gating, file-overlap holding, in-progress holding,
    deterministic ordering, and the empty-wave and all-done cases. A test asserts that no
    activation path is taken when none of the three signals is present. `ultraship migrate` carries
    a 2.0.0 workspace to 2.1.0 and is idempotent. This release is itself developed with the skill
    activated, so its own git log shows waves of task commits as evidence. `npm test` passes and
    `node bin/ultraship.mjs validate` exits 0.
scope:
  included:
    - A sixth skill at skills/subagent/SKILL.md — invoked as `/ultraship:subagent`, classified as a supporting skill rather than a sixth lifecycle phase, so product.yaml and the five-skill workflow story are untouched
    - shared/subagent-protocol.md as the single prose contract the skills read — it defines the three activation paths and their precedence, the brief a caller hands a subagent, the evidence a subagent must return, and the four things a subagent may never do
    - "Three activation paths, none of them default: direct invocation of `/ultraship:subagent`; an in-session instruction to the running skill to use subagents; or a recorded preference in project instructions (CLAUDE.md, AGENTS.md), in a memory file, or as `allow_parallel_agents: true` in .ultraship/ultraship.yaml — the last being how a developer makes it permanent"
    - A stated precedence order, so two signals that disagree resolve without a guess — an explicit in-session instruction wins over recorded instructions, which win over the `allow_parallel_agents` flag, and absence of all three means sequential execution
    - The skill announcing which activation source it matched and how many agents it is dispatching before it dispatches any, so parallel work is never a surprise
    - A twelfth CLI command `ultraship wave [product] [version]` backed by a new lib/wave.mjs — it reads the active release's tasks.yaml and prints the set of tasks that may run concurrently right now, plus, for every task excluded, the reason it was excluded
    - "The wave rule, computed deterministically and never by the agent: a task is dispatchable when its status is `todo`, every id in its `depends_on` has status `done`, and its `files` are disjoint from those of every task already admitted to the wave and every task currently `in-progress`. Ties are broken by ascending task id, so the same tasks.yaml always yields the same wave"
    - Develop wiring — when the skill is active, develop calls `ultraship wave`, dispatches that wave through the subagent skill, records each returned evidence against its own task in tasks.yaml, runs the existing `develop-task` checkpoint per finished task, and then recomputes the wave; when it is not active, develop behaves exactly as it does on 2.0.0
    - A declared-versus-actual files check — each subagent returns the files it actually changed, and develop halts the run and reports rather than computing another wave when a returned file was not in that task's declared `files`, because the disjointness proof the wave rests on is only as good as those lists
    - Plan wiring — plan may hand independent research or drafting briefs to the subagent skill while a roadmap or contract is being prepared; briefs are read-only investigation and the plan skill remains the only writer of roadmap.yaml and the release contract
    - A one-line reference from brainstorm, iterate, and complete to shared/subagent-protocol.md, so the skill is reachable from all five without any of them restating the protocol
    - test/wave.test.mjs covering dependency gating, file-overlap holding, in-progress holding, deterministic id ordering, an empty wave when everything is blocked, an empty wave when everything is done, and a non-zero exit when there is no active release or no tasks file
    - A migrate step carrying a 2.0.0 workspace's framework_version to 2.1.0 with no new field and no manual edit, idempotent on rerun
    - Documentation — docs/CONTRACT.md lists twelve commands and names `subagent` among the supporting skills, docs/COMPATIBILITY.md records 2.1.0 as purely additive with no deprecation owed, README gains `ultraship wave` in the command table and a section on the three activation paths, and CHANGELOG.md gains a 2.1.0 entry
    - version_files bumped to 2.1.0 across package.json, .claude-plugin/plugin.json, and .claude-plugin/marketplace.json
  excluded:
    - Any agent spawning inside the CLI — `ultraship wave` computes a set from local YAML and prints it; dispatch is entirely agent-side, so the no-model and no-network guarantees hold unchanged
    - Parallel execution by default, in any form, including a heuristic that infers the developer wants it from repository size or task count
    - A new canonical schema or a new field for parallelism — the existing `allow_parallel_agents` preference is the persistent switch, and adding a per-release duplicate would create a second owner of the same fact
    - Subagents writing any file under .ultraship/, running `ultraship transition`, `ultraship commit`, or `ultraship deploy`, or marking their own task `done`; the calling skill records, transitions, and commits
    - Automatic git worktree isolation per subagent — `ultraship:using-git-worktrees` already exists for a developer who wants it, and wiring it into every dispatch is a larger change than the disjointness rule needs
    - Parallelism across products, across releases, or across lifecycle phases; a wave is scoped to one release's tasks.yaml
    - Retry, backoff, or automatic re-dispatch of a subagent that fails — a failed task returns to `todo` with its evidence and the developer decides
    - Agent-count autotuning, cost telemetry, or any report of tokens, dollars, or time saved; UltraShip has no provider telemetry and would be inventing the numbers
    - Fan-out for code review, which `requesting-code-review` covers today and which can adopt the protocol in a later release
    - Any change to the eleven existing commands, the ten schemas, or the five workflow skills' own behaviour when the subagent skill is not active
  fallback_scope:
    - The subagent skill, shared/subagent-protocol.md with all three activation paths and the prohibitions, lib/wave.mjs and the `ultraship wave` command, develop wiring including the declared-versus-actual files check, test/wave.test.mjs, the migrate step, the documentation, and the version bump. Plan's research briefs and the one-line references from brainstorm, iterate, and complete are the deferrable extension. This still delivers a coherent outcome — a developer activates parallel work any of the three ways and the skill that generates the most independent work dispatches it — and the protocol it ships is the same one the remaining skills would later reference, so nothing has to be redesigned to add them.
acceptance:
  functional:
    - skills/subagent/SKILL.md exists, carries the standard name and description frontmatter, and is invocable as `/ultraship:subagent`
    - shared/subagent-protocol.md states the three activation paths, their precedence order, the brief format, the required return format, and the four prohibitions, and skills/plan and skills/develop reference it rather than restating it
    - With none of the three activation signals present, `/ultraship:develop` produces the same sequential behaviour as 2.0.0 and dispatches no subagent
    - "An explicit in-session instruction to use subagents activates the skill even when `allow_parallel_agents` is false, and the skill names that instruction as the activation source before dispatching"
    - "`allow_parallel_agents: true` in .ultraship/ultraship.yaml activates the skill with no further instruction, which is how a developer makes parallel work their default"
    - The skill announces the matched activation source and the number of agents it is about to dispatch before dispatching any of them
    - "`ultraship wave [product] [version]` prints JSON naming the dispatchable task ids and, for every task not in the wave, the reason it was excluded"
    - A task is admitted to the wave only when its status is `todo`, every id in `depends_on` has status `done`, and its `files` are disjoint from those of every task already in the wave and every task whose status is `in-progress`
    - Two independent runs of `ultraship wave` against the same unchanged tasks.yaml return the same wave in the same order, ties broken by ascending task id
    - "`ultraship wave` returns an empty wave with a reason per task when every remaining task is blocked, and an empty wave when every task is `done`; it exits non-zero when there is no active release or no tasks file"
    - Develop records each subagent's returned evidence against that subagent's own task in tasks.yaml and runs `ultraship commit develop-task --task <id>` per finished task, so the existing commit protocol is unchanged
    - Develop halts the run and reports rather than computing another wave when a subagent returns a changed file that was not in that task's declared `files`
    - A subagent writes no file under .ultraship/ and runs no `ultraship transition`, `ultraship commit`, or `ultraship deploy`; the protocol states this and the calling skill performs all four
    - "`ultraship migrate` carries a 2.0.0 workspace to framework_version 2.1.0, adds no field, and changes nothing when rerun"
    - docs/CONTRACT.md lists twelve CLI commands including `ultraship wave` and names `subagent` among the supporting skills
  non_functional:
    - No command, skill, schema, or field is removed or renamed; a 2.0.0 workspace passes `ultraship validate` unchanged on 2.1.0, so this is a minor release owing no deprecation window under docs/COMPATIBILITY.md
    - The CLI still calls no model and touches no network — `ultraship wave` reads local YAML and prints JSON, and every dispatch decision is made by the agent, not the CLI
    - No runtime npm dependency is added; lib/wave.mjs uses Node 20+ stdlib and the vendored YAML parser through lib/yaml.mjs
    - No `.ultraship/...` path is hardcoded in lib/wave.mjs; every path is derived from `paths(root)`
    - The release reports no token, dollar, or time figure for parallel execution, because none is measured
    - "`ultraship migrate` remains forward-only and idempotent"
    - README, CHANGELOG.md, docs/CONTRACT.md, and docs/COMPATIBILITY.md describe the skill and the command accurately, and every path and command they name exists
  operational:
    - "`npm test` passes locally and in CI, including test/wave.test.mjs and the migrate test for the 2.0.0 to 2.1.0 step"
    - "`node bin/ultraship.mjs validate` exits 0 on this workspace"
    - version_files (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) all read 2.1.0 at release
    - This release is developed with the subagent skill activated, so this repository's own git log for 2.1.0 shows waves of per-task commits and is the release's primary evidence
    - "`ultraship deploy` runs the declared published hook and records the GitHub release as deployment evidence"
delivery:
  target_mode: published
  environment: >
    The GitHub repository zeroonething/ultraship and the Claude Code plugin marketplace it is
    installed from. The change is one new skill file, one new shared contract, one new lib module,
    one new dispatch entry, edits to five skill files, and documentation; there is no server and no
    hosted component.
  deployment_method: >
    Work on branch feat/2.1.0, opened as a pull request and merged to main by the maintainer. After
    the merge, `ultraship deploy` runs the declared published delivery hook, which creates the
    GitHub release from the CHANGELOG entry and verifies it with the smoke command.
  migrations:
    - "`ultraship migrate` carries a 2.0.0 workspace to framework_version 2.1.0. No canonical field is added, removed, or reshaped, so there is nothing for a workspace to migrate beyond the version line. The step is idempotent and requires no hand edit."
  observability:
    - The CI workflow's pass/fail on every pull request, plus npm test and ultraship validate, are the health checks
    - "`ultraship wave` output is itself observable — it names every excluded task and why, so a run that dispatches fewer agents than expected explains itself without a debugging session"
    - This repository's git log for 2.1.0 is the running evidence that waves of tasks committed independently
  rollback: >
    Revert the pull-request merge commit. Short of a revert, the feature disables itself: with no
    activation signal present nothing dispatches, so removing `allow_parallel_agents: true` and any
    instruction that names subagents returns the workspace to 2.0.0 behaviour with no state to
    unwind. No canonical file shape changed and no released record is affected, so a workspace that
    ran on 2.1.0 is still valid on 2.0.0 apart from the framework_version line. Task commits already
    made by a wave are ordinary git history and stay valid after either remedy.
dependencies:
  products: []
  services:
    - A host agent tool capable of dispatching concurrent subagents; where none exists the skill reports that and runs sequentially rather than fabricating a dispatch
    - Git must be on PATH for the per-task commits, which is already true of the 2.0.0 commit protocol
    - GitHub Actions for CI and the gh CLI for the published delivery hook, both already in use
  human_approvals:
    - The maintainer reviews and merges the pull request
    - The maintainer confirms that the three activation paths and their precedence are the ones they want, since this decides when the framework spawns agents in their repository
    - The maintainer accepts a sixth skill on the public surface, classified as supporting rather than a lifecycle phase
    - The maintainer authorizes the GitHub release, which stays a post-merge step
risks:
  - A task's declared `files` list is the entire basis of the disjointness proof, and 2.0.0 already recorded that an incomplete list silently produces a commit missing part of its implementation. Under parallel dispatch the same gap becomes two agents editing one file at once. Mitigated by every subagent returning the files it actually changed, by develop halting the run on any file outside the declared list rather than computing another wave, and by the wave command printing exactly which files it used to hold each excluded task.
  - Concurrency makes failure harder to attribute — a broken repository after a wave of four could come from any of them. Mitigated by per-task commits, which 2.0.0 already ships, so each subagent's work is isolated in history and revertible on its own, and by dispatching only tasks the wave rule proved file-disjoint.
  - A subagent that writes canonical state creates the competing truth the whole framework exists to prevent, and four of them do it four times. Mitigated by the protocol prohibiting canonical writes, transitions, commits, and deploys outright, by the brief carrying that prohibition into every dispatch, and by the calling skill being the only caller of those commands.
  - Ambiguous activation could spawn agents nobody asked for, which would repeat exactly the mistake 2.0.0 spent a major version absorbing. Mitigated by default-off, by an explicit written precedence order for the three signals, and by the skill announcing its matched activation source and agent count before dispatching.
  - Parallel dispatch can burn budget a cost-conscious developer constrained, and UltraShip cannot measure what it spends. Mitigated by reading the recorded resource preferences and constraints before dispatching, by refusing to report any saving it did not measure, and by the developer being the one who turned it on.
  - Results arriving in nondeterministic order could produce a different tasks.yaml between two identical runs, which would undermine the canonical-state guarantee. Mitigated by recording returned evidence in task-id order rather than arrival order, and by the wave itself being deterministic.
  - A sixth skill dilutes the five-skill workflow the product definition is built on. Mitigated by classifying `subagent` as a supporting skill alongside the seven that already exist, leaving product.yaml and the lifecycle untouched — it is called by the workflow, not a phase of it.
  - The protocol lives in prose while the skills that must obey it live in six separate files, which is the drift failure CLAUDE.md warns about. Mitigated by keeping activation, brief, return, and prohibition rules in shared/subagent-protocol.md only, with the skills referencing it.
resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
    - Getting the activation precedence right and written once, since it decides when the framework spawns agents in someone else's repository
    - The declared-versus-actual files check, which is where a wrong `files` list turns from a cosmetic gap into a correctness problem
    - Writing the subagent brief and return format tightly enough that a dispatched agent cannot drift into writing canonical state
    - Threading the protocol through five skill files without any of them restating it
    - Test coverage for the wave rule's edge cases — cycles in `depends_on`, a task depending on a deferred or blocked task, and overlapping files declared by three or more tasks
  preferred_tools:
    - Claude Code
  constraints:
    - Zero runtime npm dependencies; Node 20 or newer
    - The CLI never calls a model and never touches the network, so it computes waves and never dispatches
    - No canonical schema changes; the existing `allow_parallel_agents` preference is the only persistent switch
    - Nothing is parallel by default
open_questions:
  - Whether the wave computation is its own command or a flag on `ultraship state`. Leaning its own command, because `state` is the cheap universal snapshot every skill already calls and loading task-graph analysis into it would make that call more expensive for every caller. Decided in develop.
  - Whether there is a cap on concurrent agents, and whether it is configurable. Leaning a documented default cap with no new config field, since a new field would need a schema change this release excludes. Decided in develop with the maintainer.
  - Whether an in-session activation offers to persist itself to `allow_parallel_agents`. Leaning offer-and-ask rather than write silently, since writing workspace config without being asked is the pattern 2.0.0 established as unacceptable. Decided in develop.
  - How the skill behaves when the host agent tool cannot dispatch concurrently. Leaning report it plainly and run sequentially, never fabricate a dispatch — the same rule `using-ultraship`'s platform references already apply. Confirmed in develop.
  - Whether a task depending on a `deferred` or `blocked` task is reported as blocked or simply excluded, and whether a dependency cycle is an error or an empty wave. Leaning explicit reasons for all three, with a cycle reported rather than silently returning nothing. Decided in develop with test coverage.
  - Whether plan's research briefs need any structure beyond the shared brief format, given they are read-only and write nothing. Leaning no extra structure. Decided in develop.
