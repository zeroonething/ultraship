product: ultraship
version: 2.2.0
status: planned
release_type: minor
outcome:
  user_can: >
    Trust UltraShip's GitHub security tab, because every open code-scanning alert is either fixed in
    the repository or ruled out of scope in writing. The one real defect CodeQL found in UltraShip's
    own code is fixed: `cell()` in lib/views.mjs escaped a pipe to `\|` without first escaping a
    backslash, so a canonical value containing `\|` rendered as a literal backslash followed by a
    cell-terminating pipe and broke the generated Markdown table. It is fixed at its single site —
    the only Markdown-emitting function in lib/ — and the existing views test, whose assertion was
    too weak to catch it, is strengthened with a backslash-bearing fixture. The CI workflow declares
    an explicit least-privilege `permissions: contents: read` instead of inheriting whatever the
    repository or organisation default happens to be. Code scanning moves off GitHub's default setup
    onto a checked-in `.github/workflows/codeql.yml` with a `.github/codeql/codeql-config.yml` that
    excludes `vendor/`, because default setup accepts no path filter and UltraShip ships a verbatim
    copy of the `yaml` package it does not own and must not patch. The rule for third-party code —
    excluded from scanning, tracked by version, upgraded rather than patched when an advisory names
    it — is written into CONTRIBUTING and SECURITY, and CLAUDE.md gains the same rule so an agent
    working in this repository does not reintroduce the pattern.
  business_value: >
    UltraShip asks developers to trust it with their release records. A public repository whose
    security tab shows six unexplained open alerts undercuts that on the first look a prospective
    contributor takes. Five of the six are not defects in UltraShip at all — four are ReDoS findings
    inside the vendored YAML parser, and one is a workflow-permissions warning — but nothing in the
    repository says so, so a reader cannot tell an accepted risk from an unattended one. That is the
    same failure mode the whole framework exists to prevent: a fact with no canonical owner. Fixing
    the one genuine bug, writing down the vendoring policy, and making the scanner configuration a
    reviewable file in the repository rather than a setting in a web UI turns the security tab from
    noise into a gate — and the gate is what a 1.1.0 contributor guide and a frozen public contract
    were already promising.
  evidence_of_value: >
    `gh api repos/zeroonething/ultraship/code-scanning/alerts` reports no open alert after the
    workflow's first run on main. `lib/views.mjs` escapes backslash and pipe in one pass and
    test/views.test.mjs asserts the exact rendered form of a `\|` input rather than merely that some
    escaped pipe exists. `.github/workflows/ci.yml` declares `permissions: contents: read`.
    `.github/workflows/codeql.yml` and `.github/codeql/codeql-config.yml` exist, are checked in, and
    exclude `vendor/`. SECURITY.md, docs/CONTRIBUTING-WITH-ULTRASHIP.md or CONTRIBUTING.md, and
    CLAUDE.md all state the vendored-code policy. `npm test` passes and
    `node bin/ultraship.mjs validate` exits 0.
scope:
  included:
    - "A correct `cell()` in lib/views.mjs — one pass escaping both meta-characters, `String(value).replace(/\\s+/g, ' ').trim().replace(/[\\\\|]/g, '\\\\$&')`, so a backslash is escaped before a pipe can be re-exposed by it. It is the only Markdown-emitting function in lib/, so there is no sibling caller to patch."
    - A strengthened regression test in test/views.test.mjs — the existing 'multi-line and pipe-bearing values stay inside their table cell' case gains a fixture whose value contains a literal backslash immediately before a pipe, and an assertion on the exact rendered escape rather than the current weak match on any escaped pipe
    - "`permissions: contents: read` declared at the top level of .github/workflows/ci.yml, so the workflow's GITHUB_TOKEN is least-privilege regardless of the repository or organisation default"
    - A checked-in CodeQL advanced setup — .github/workflows/codeql.yml running the javascript-typescript and actions analyses on push to main, on pull requests, and on a weekly schedule, with its own least-privilege permissions block and SHA-pinned actions matching the convention ci.yml already uses
    - .github/codeql/codeql-config.yml declaring `paths-ignore` for `vendor/`, which is the whole reason for moving off default setup — default setup accepts no path filter, so vendored third-party code cannot be excluded while it is in force
    - Disabling GitHub's CodeQL default setup for the repository, since default and advanced setup cannot both be in force, and confirming the advanced workflow ran green on main afterwards
    - A written third-party-code policy — vendored dependencies are excluded from this repository's code scanning because UltraShip ships them verbatim and patching them would break re-vendoring; they are tracked by pinned version, and an advisory naming one is answered by re-vendoring the fixed upstream release, never by editing vendor/
    - That policy stated in SECURITY.md and in the contributor guidance, and mirrored into CLAUDE.md so an agent working in this repository inherits it
    - CLAUDE.md brought up to date generally — the security-scanning and vendoring rule, and any stale statement about the repository's CI or contract surface found while making the change
    - Documentation — docs/COMPATIBILITY.md records 2.2.0 as a fix-only release owing no deprecation, CHANGELOG.md gains a 2.2.0 entry, and docs/CONTRACT.md is checked and left unchanged because nothing on the frozen surface moves
    - version_files bumped to 2.2.0 across package.json, .claude-plugin/plugin.json, and .claude-plugin/marketplace.json
  excluded:
    - "Editing anything under vendor/. The four `js/polynomial-redos` alerts are in the `yaml` package's own dist output; patching them would fork a vendored copy from its upstream and silently break the next re-vendor, which is a worse defect than the finding."
    - Upgrading or re-vendoring the `yaml` package as part of this release. Nothing in the scanning result is an advisory against it, and a parser swap is its own release with its own test evidence.
    - "Dismissing alerts through the GitHub API as `won't fix`. A dismissal is a click in a web UI that no reviewer can see in a diff; the same decision expressed as a checked-in `paths-ignore` plus a written policy is reviewable, revertible, and survives the next repository."
    - Any change to the twelve CLI commands, the ten schemas, or the skills. `cell()` is a module-private helper that docs/CONTRACT.md does not freeze, so no public surface moves and no migration is owed beyond the framework_version line.
    - Escaping or sanitising the non-table Markdown in lib/views.mjs — the list items and bold lines at :95, :143-146, :157, and :189 interpolate free text without `cell()`, but a pipe is harmless outside a table row. Recorded as a known limitation rather than fixed under a security release it does not belong to.
    - Adding a linter, a secret-scanning workflow, a dependency-review action, or any scanner beyond the CodeQL analysis the repository already had
    - Branch protection, required status checks, or any repository setting other than the default-setup switch this release must flip to make the workflow effective
  fallback_scope:
    - "The lib/views.mjs fix with its regression test, the ci.yml permissions block, and the CHANGELOG and version bump. This still delivers a coherent outcome — the one real defect in UltraShip's own code is fixed and the one real workflow weakness is closed — and it is honest, because the remaining four alerts are third-party and would simply stay open with the reason unstated. The CodeQL workflow, the vendor exclusion, and the written policy are the deferrable extension; deferring them costs a clean security tab, not a correct one."
acceptance:
  functional:
    - "`cell()` renders a value containing a literal backslash immediately before a pipe as an escaped backslash followed by an escaped pipe, so neither character terminates the Markdown cell"
    - "`cell()` still collapses whitespace runs to a single space and still returns the em dash for null, undefined, and the empty string, so no existing view output changes for values that contain neither meta-character"
    - test/views.test.mjs contains a fixture whose value includes `\|` and asserts the exact rendered escape sequence rather than matching any escaped pipe
    - "`node bin/ultraship.mjs views` regenerates this repository's own four views with no content change other than what the escape fix requires"
    - ".github/workflows/ci.yml declares `permissions: contents: read` and CI still passes on Node 20 and 22"
    - .github/workflows/codeql.yml exists, analyses javascript-typescript and actions, references .github/codeql/codeql-config.yml, declares its own permissions block, and pins every action by commit SHA
    - .github/codeql/codeql-config.yml excludes vendor/ via paths-ignore
    - GitHub CodeQL default setup is disabled for the repository and the advanced workflow has completed a green run on main
    - "`gh api repos/zeroonething/ultraship/code-scanning/alerts --jq '[.[] | select(.state == \"open\")] | length'` returns 0 after that run"
    - SECURITY.md, the contributor guidance, and CLAUDE.md each state that vendored third-party code is excluded from scanning, tracked by version, and answered by re-vendoring rather than patching
    - CLAUDE.md is accurate against the repository as it stands at 2.2.0 — every path, command, and count it names exists
  non_functional:
    - No CLI command, skill, schema, or canonical field is added, removed, renamed, or reshaped, so a 2.1.0 workspace is valid on 2.2.0 with no migration beyond framework_version
    - The CLI still calls no model and touches no network
    - No runtime npm dependency is added and nothing under vendor/ is modified — `git diff main -- vendor/` is empty
    - The escape fix is a strict superset of the old behaviour for inputs containing no backslash, so no previously generated view is invalidated
    - "`ultraship migrate` remains forward-only and idempotent"
  operational:
    - "`npm test` passes locally and in CI, with the strengthened views test failing against the pre-fix `cell()` and passing after it"
    - "`node bin/ultraship.mjs validate` exits 0 on this workspace"
    - version_files (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) all read 2.2.0 at release
    - "`ultraship deploy` runs the declared published hook and records the GitHub release as deployment evidence, after the pull request merges to main"
delivery:
  target_mode: published
  environment: >
    The GitHub repository zeroonething/ultraship, its Actions workflows, and its code-scanning
    configuration. The change is one line of library code, one test, two workflow-side files, one
    repository setting, and documentation. There is no server and no hosted component.
  deployment_method: >
    Work on branch feat/2.2.0, opened as a pull request and merged to main. The CodeQL default-setup
    switch is flipped through the GitHub API so the checked-in workflow takes effect. After the
    merge, `ultraship deploy` runs the declared published hook, which creates the GitHub release from
    the CHANGELOG entry and verifies it with the smoke command.
  migrations:
    - "`ultraship migrate` carries a 2.1.0 workspace to framework_version 2.2.0. No canonical field is added, removed, or reshaped, so there is nothing to migrate beyond the version line. The step is idempotent and requires no hand edit."
  observability:
    - The CI workflow's pass/fail on every pull request
    - The CodeQL workflow's own run status and the repository's code-scanning alert count, which is the release's headline number and is queryable with one `gh api` call
    - "`node bin/ultraship.mjs validate` exit code"
  rollback: >
    Revert the pull-request merge commit. The library change is one line and reverting it restores
    the previous escape behaviour exactly; no canonical file shape changed and no released record is
    affected, so a workspace that ran on 2.2.0 is still valid on 2.1.0 apart from the
    framework_version line. Reverting the workflow files leaves the repository with no code scanning
    until default setup is re-enabled, which is a single API call and is the documented remedy.
dependencies:
  products: []
  services:
    - GitHub Actions for CI and for the CodeQL analysis
    - GitHub code scanning, whose default setup must be disabled through the API before the checked-in workflow can take effect
    - The gh CLI, already in use for the published delivery hook
  human_approvals:
    - The maintainer accepts moving code scanning from default setup to a checked-in workflow, since that changes who owns the scanner configuration
    - The maintainer accepts that vendored third-party code is excluded from scanning rather than patched or dismissed
risks:
  - "Disabling default setup leaves a window in which the repository has no code scanning at all, and if the advanced workflow is misconfigured the window does not close. Mitigated by adding and merging the workflow before flipping the setting, and by treating a green run on main plus a zero open-alert count as the release's acceptance criterion rather than assuming it."
  - "`paths-ignore` for vendor/ is a permanent blind spot, and a future vendored dependency with a real vulnerability would not be flagged here. Mitigated by writing the policy down in three places, by pinning the vendored version, and by making re-vendoring the stated response to any advisory — the alternative, per-alert dismissal, has the same blind spot with none of the writing."
  - "The escape fix changes generated output, and a view regenerated on 2.2.0 will differ from one generated on 2.1.0 for any value containing a backslash. Mitigated by views being derived and never authoritative, by regenerating this repository's own views in the same release, and by the change being a strict no-op for values with no backslash."
  - "CLAUDE.md drifts from the repository the moment either changes, and a stale instruction file misleads every future agent session more quietly than stale prose misleads a human. Mitigated by making CLAUDE.md accuracy an acceptance criterion with an explicit path-and-command check rather than a read-through."
  - "A security-titled release invites scope creep into scanners, linters, and repository settings nobody asked for. Mitigated by an explicit excluded list naming each of them."
resource_profile:
  complexity: small
  uncertainty: low
  likely_cost_drivers:
    - Getting the CodeQL advanced workflow right on the first try, since verifying it needs a real run on GitHub rather than a local check
    - The default-setup switch, which is a one-way-feeling repository setting and the only step that cannot be undone by reverting a commit
    - Auditing CLAUDE.md against the repository rather than merely appending to it
  preferred_tools:
    - Claude Code
  constraints:
    - Zero runtime npm dependencies; Node 20 or newer
    - Nothing under vendor/ may be modified
    - No public-contract surface may move, so this stays a minor release
open_questions:
  - Whether the CodeQL workflow should also analyse on a schedule or only on push and pull request. Leaning weekly, matching what default setup already did, so a newly published query still finds old code. Decided in develop.
  - Whether the vendoring policy belongs in SECURITY.md, CONTRIBUTING, or both. Leaning both, with SECURITY.md owning the wording and the contributor guide pointing at it. Decided in develop.
