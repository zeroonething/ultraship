product: ultraship
version: 2.0.0
status: released
release_type: major
outcome:
  user_can: >
    Run the UltraShip lifecycle and have it commit its own work as it goes, without configuring
    anything. Plan commits the roadmap and then the release contract; develop commits the generated
    task set, then every task the moment it reaches `done` with its evidence and its own declared
    files, and every checkpoint file; iterate commits the iteration record together with every
    canonical file the change touched; complete commits the captured evidence and then the immutable
    release record with its lock entry and version-file bumps. Each commit carries a single
    conventional-format message derived from canonical state, not invented by the agent. The command
    is local-only — it stages and commits, and never pushes, branches, or tags, so the developer
    keeps every outward-facing step. A developer who does not want the framework touching git sets
    `commit_policy` to `off`, and any workspace upgraded from 1.x has exactly that written for it by
    `ultraship migrate`, so no existing project starts committing without being asked.
  business_value: >
    Today a whole UltraShip release arrives as one undifferentiated working tree. The framework's
    central claim is that a release is a traceable record — the roadmap, the contract, the evidence,
    the immutable record — yet the version-control history, which is where every other developer
    actually reads that record, shows none of it. Nothing distinguishes the commit that specified the
    release from the commit that shipped it, a task's implementation cannot be reviewed or reverted
    on its own, and a long develop run that is interrupted loses everything not yet saved. Committing
    at the checkpoints the state model already defines turns git history into a second, independent
    view of the same canonical truth — reviewable per task, revertible per task, and resumable after
    any interruption. It also makes 2.1.0's parallel task execution safe to build, because each
    concurrent task needs its own commit boundary to be reviewable at all. Shipping it on by default
    is what makes it real — an opt-in flag most people never find would leave the history exactly as
    undifferentiated as it is now — and shipping it as a major, with migrate preserving every
    existing workspace's behaviour, is what makes it honest.
  evidence_of_value: >
    `ultraship commit <checkpoint>` exists as the eleventh CLI command, is documented in
    docs/CONTRACT.md as part of the 2.0 contract, and is exercised by tests covering the default-on
    path, `commit_policy: off`, nothing to commit, not a git repository, and a real commit whose
    message matches the derived conventional format. `ultraship migrate` carries a 1.1.0 workspace to
    2.0.0, writes `commit_policy: off` into it, and is idempotent when rerun. Running the five skills
    against this repository produces a git log in which the roadmap commit, the contract commit, each
    task commit, and the release-record commit are separately identifiable. The README carries CI,
    Node, version, and license badges and documents the policy. `npm test` passes and
    `ultraship validate` exits 0.
scope:
  included:
    - A new optional `commit_policy` field in schemas/ultraship.schema.json — a string enum of `off` and `checkpoint`, where an absent field means `checkpoint`; this inversion of the default is the breaking change that makes the release major
    - A new lib/commit.mjs implementing checkpoint commits — it reads the policy, resolves the paths for the named checkpoint through lib/paths.mjs, stages exactly those paths, derives a Conventional Commits message from canonical state, and commits; it never pushes, never creates a branch, and never creates a tag
    - An eleventh CLI command `ultraship commit <checkpoint> [product] [version]` dispatched from bin/ultraship.mjs, printing JSON to stdout like every other command and exiting non-zero only when a commit was required by the policy and git refused it
    - Silent, exit-0 no-op behaviour whenever the policy is off, the directory is not a git repository, git is not on PATH, or the checkpoint's paths hold no changes — so a git-touching command in every skill path can never spuriously fail
    - A migrate step carrying any pre-2.0 workspace forward by setting `commit_policy` to `off` in its ultraship.yaml, so an upgraded project keeps 1.x behaviour until its owner opts in; the step is idempotent and keyed off the recorded framework_version, and a fresh `ultraship init` writes `checkpoint`
    - A shared/commit-protocol.md naming every checkpoint, the paths it stages, and the message format, so the four skills reference one contract instead of restating a git recipe four times
    - Checkpoint calls added to skills/plan, skills/develop, skills/iterate, and skills/complete at the points shared/commit-protocol.md defines
    - Develop's task checkpoint stages the task's own `files` list from tasks.yaml alongside the updated tasks.yaml, so a task commit contains its implementation and its evidence together
    - Complete's release checkpoint runs after the record and .ultraship/releases.lock are written and after version_files are bumped, so the shipped commit is internally consistent
    - README badges — CI status, Node version, current version, and license — plus a README section documenting `commit_policy` and the commit command, and the command added to the README command table
    - Documentation restated for a 2.0 contract — docs/CONTRACT.md becomes the 2.0 contract listing eleven commands and noting `commit_policy` on the ultraship.schema row, docs/COMPATIBILITY.md records the default inversion as the 2.0 break and the migrate step that absorbs it, CHANGELOG.md gains a 2.0.0 entry with an explicit BREAKING CHANGE note, and CONTRIBUTING.md plus docs/CONTRIBUTING-WITH-ULTRASHIP.md explain the commit protocol a contributor will now see running
    - test/commit.test.mjs covering default-on, policy off, no changes, non-git directory, a real commit and its message format, and an assertion that no push, branch, or tag is ever invoked; plus a migrate test proving a 1.1.0 workspace upgrades to 2.0.0 with `commit_policy` set to `off` and that rerunning migrate changes nothing
    - version_files bumped to 2.0.0 across package.json, .claude-plugin/plugin.json, and .claude-plugin/marketplace.json, and this repository's own .ultraship/ultraship.yaml left on the default so UltraShip dogfoods the feature exactly as a new user receives it
  excluded:
    - Any push, branch creation, tag, or pull-request operation — outward-facing git stays the developer's authorized manual step and the CLI keeps its no-network guarantee
    - A new `validate` check for uncommitted state — canonical state is legitimately dirty throughout develop, so a blanket check would break normal work; complete's gate is the failing `ultraship commit` exit code instead
    - Any change to the ten canonical state file shapes beyond the one new optional field; no released record, roadmap, task, or iteration schema changes, so a 1.x workspace's data is still valid data
    - Commit signing, git hooks, message templating configuration, squashing, or amend behaviour
    - Parallel subagent task execution, which is 2.1.0
    - Retrofitting commits onto the brainstorm skill; product.yaml is written once and its commit is the developer's own
    - Removing or renaming any 1.x command, skill, or field — 2.0.0 changes one default and adds one command, and carries no removals, so no deprecation window is owed under docs/COMPATIBILITY.md
  fallback_scope:
    - The `commit_policy` field with its default-on behaviour, lib/commit.mjs, the `ultraship commit` command with its no-op paths, the migrate step writing `off` into upgraded workspaces, shared/commit-protocol.md, checkpoint calls in develop and complete only, test/commit.test.mjs, the docs and README badge updates, and the version bump. Plan and iterate checkpoints are the deferrable extension — they commit one file each and a developer can commit those by hand. This still delivers a coherent outcome, because the two skills that produce the most untracked work commit it themselves, per task and per release record, and the compatibility story is unchanged.
acceptance:
  functional:
    - schemas/ultraship.schema.json accepts an optional `commit_policy` string of `off` or `checkpoint`, rejects any other value, and validates a workspace that omits the field entirely
    - A workspace that omits `commit_policy` commits at checkpoints, and a workspace setting it to `off` does not — the default is on, and a test asserts both directions
    - "`ultraship commit <checkpoint>` exits 0 and prints JSON reporting `committed: false` when the policy is `off`, when the checkpoint's paths hold no changes, when the directory is not a git repository, and when git is not on PATH"
    - "`ultraship commit <checkpoint>` under the default policy creates exactly one commit containing only the paths that checkpoint declares, and prints the resulting commit SHA as JSON"
    - The commit message is a Conventional Commits subject derived from the product, version, and checkpoint in canonical state, and carries no co-author or tool-attribution trailer
    - "`ultraship commit` never runs `git push`, `git branch`, `git tag`, or any network operation, asserted by a test that inspects the git invocations the module makes"
    - "`ultraship migrate` carries a 1.1.0 workspace to framework_version 2.0.0 and writes `commit_policy: off` into its ultraship.yaml, and rerunning it changes nothing"
    - "`ultraship init` on a fresh directory writes a workspace whose commit policy is the default `checkpoint`"
    - shared/commit-protocol.md names every checkpoint, the paths it stages, and the message format, and skills/plan, skills/develop, skills/iterate, and skills/complete each call the checkpoints it defines
    - Develop's task checkpoint stages the completing task's `files` entries from tasks.yaml together with tasks.yaml itself
    - Complete's release checkpoint runs after the release record, .ultraship/releases.lock, and the version_files bumps are all written
    - README shows CI status, Node version, version, and license badges, documents `commit_policy`, and lists `ultraship commit` in the command table
    - docs/CONTRACT.md is stated as the 2.0 contract and lists eleven CLI commands including `ultraship commit`, and docs/COMPATIBILITY.md records the default inversion as the 2.0 break with the migrate step that absorbs it
  non_functional:
    - A workspace written by 1.0.0 or 1.1.0 still passes `ultraship validate` on 2.0.0 — its data is unchanged and only the default behaviour differs, which migrate pins to `off`
    - "`ultraship migrate` remains forward-only and idempotent, and no manual edit of canonical state is ever required to move a workspace from 1.x to 2.0"
    - The 2.0.0 break is confined to one default and is announced in CHANGELOG.md as a BREAKING CHANGE with the one-line remedy; no 1.x command, skill, or field is removed or renamed, so nothing required a prior deprecation release
    - No runtime npm dependency is added; git is invoked through Node 20+ stdlib child_process only, and the vendored-parser zero-install guarantee holds
    - The CLI still makes no network call and still never calls a model
    - CHANGELOG.md and CONTRIBUTING.md describe the commit protocol accurately, and every path and command named in the documentation exists
  operational:
    - "`npm test` passes locally and in CI, including test/commit.test.mjs and the migrate idempotency test"
    - "`node bin/ultraship.mjs validate` exits 0 on this workspace"
    - version_files (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) all read 2.0.0 at release
    - This repository develops and completes 2.0.0 using the default commit policy, so its own git history is the release's primary evidence
    - "`ultraship deploy` runs the declared published hook and records the GitHub release as deployment evidence"
delivery:
  target_mode: published
  environment: >
    The GitHub repository zeroonething/ultraship and the Claude Code plugin marketplace it is
    installed from. The change is a new module, a new dispatch entry, a new optional schema field, a
    migrate step, and four skill files; there is no server and no hosted component.
  deployment_method: >
    Work on branch feat/2.0.0, opened as a pull request and merged to main by the maintainer. After
    the merge, `ultraship deploy` runs the declared published delivery hook, which creates the GitHub
    release from the CHANGELOG entry and verifies it with the smoke command.
  migrations:
    - "`ultraship migrate` carries any pre-2.0 workspace forward by writing `commit_policy: off` into its ultraship.yaml and updating framework_version, so an upgraded project keeps 1.x behaviour until its owner opts in. The step is idempotent and requires no hand edit."
  observability:
    - The CI workflow's pass/fail on every pull request, plus npm test and ultraship validate, are the health checks
    - The git log of this repository is itself the running evidence — after this release, the roadmap, contract, task, and release commits are separately identifiable in UltraShip's own history
  rollback: >
    Revert the pull-request merge commit. Setting `commit_policy` to `off` disables the feature
    without a revert and with no state to unwind. No canonical file shape changed and no released
    record is affected, so a workspace that ran on 2.0.0 is still valid on 1.1.0 apart from the
    framework_version line. Commits the feature already made are ordinary git history and stay valid
    after either remedy.
dependencies:
  products: []
  services:
    - Git must be on PATH for the commit command to do anything; its absence is treated as a no-op, not an error
    - GitHub Actions for CI and the gh CLI for the published delivery hook, both already in use
  human_approvals:
    - The maintainer reviews and merges the pull request
    - The maintainer confirms the checkpoint list in shared/commit-protocol.md matches where they actually want commits to land
    - The maintainer accepts that 2.0.0 is the new frozen public contract and that docs/CONTRACT.md is restated as such
    - The maintainer authorizes the GitHub release, which stays a post-merge step
risks:
  - Committing by default means UltraShip now writes to the developer's repository without being asked, which is the single largest behavioural change the framework has made. Mitigated by staging only explicit declared paths, by no-op-on-anything-unexpected behaviour, by the hard exclusion of push, branch, and tag so nothing leaves the machine, and by migrate pinning every upgraded workspace to `off`.
  - A commit protocol that stages too broadly could sweep a developer's unrelated working changes into an UltraShip commit. Mitigated by staging only the explicit paths each checkpoint declares — canonical files plus, for a task checkpoint, that task's own declared files — and never using a bare `git add -A`.
  - A task whose `files` list in tasks.yaml is wrong or incomplete produces a commit missing part of its implementation. Mitigated by the checkpoint reporting the staged paths in its JSON output, so a mismatch is visible rather than silent.
  - The four skills and shared/commit-protocol.md could drift out of step, which is the failure mode CLAUDE.md warns about for shared prose contracts. Mitigated by keeping the checkpoint list in one file and having the skills reference it rather than restate it.
  - Committing during develop interacts with the interrupted-work and checkpoint paths; a commit made while the repository is failing could record a broken state. Mitigated by the develop task checkpoint firing only when a task reaches `done` with recorded evidence, and by the existing checkpoint file recording `repository_state`.
  - A major version signals more upheaval than this release actually contains, and users may delay upgrading. Mitigated by a CHANGELOG entry that states plainly that the break is one default, that migrate absorbs it automatically, and that no command, skill, or schema was removed.
resource_profile:
  complexity: medium
  uncertainty: low
  likely_cost_drivers:
    - Getting the no-op paths exhaustively right, since a spurious failure in a git-touching command would block every skill
    - Deciding the checkpoint list and message format once, in shared/commit-protocol.md, and threading it through four skills without restating it
    - Test coverage for git behaviour without leaving repositories behind or committing to this repository during the run
    - Restating docs/CONTRACT.md and docs/COMPATIBILITY.md for a 2.0 contract without losing the precision the 1.0 versions have
    - Bringing README, CHANGELOG, and both contributing guides in step with an eleventh command and a changed default
  preferred_tools:
    - Claude Code
  constraints:
    - Zero runtime npm dependencies; git is invoked through Node 20+ stdlib only
    - Node 20 or newer
    - The CLI never calls a model and never touches the network
    - The 2.0 break is confined to one default; no command, skill, or schema is removed or renamed
open_questions:
  - Does `schema_version` move from 1 to 2? The ten canonical file shapes do not break, so the argument for keeping it at 1 is strong, but docs/CONTRACT.md currently ties schema_version to the contract version. Decided with the maintainer in develop; whichever way it goes, migrate and the docs must agree.
  - Exact checkpoint names and their granularity — whether develop commits per task only, or also per acceptance criterion. Leaning per task. Settled in shared/commit-protocol.md during develop, with the maintainer.
  - Whether the commit subject uses the checkpoint name as the Conventional Commits type (`plan:`, `develop:`) or a standard type with the checkpoint in the scope (`chore(plan):`). Leaning the latter for tooling compatibility. Decided in develop.
  - Whether `ultraship commit` takes the checkpoint as a positional argument or a `--checkpoint` flag, given every other command uses positionals. Leaning positional for consistency. Decided in develop.
  - Which badges the README carries beyond CI, Node, version, and license — a zero-dependencies badge is tempting but must be accurate. Decided in develop.
released_at: 2026-07-31T00:00:00Z
mode: release-ready
delivered: >
  The UltraShip lifecycle commits its own work. Four skills — plan, develop,
  iterate, and complete — call the eleventh CLI command, `ultraship commit
  <checkpoint>`, at the seven checkpoints defined in shared/commit-protocol.md.
  The roadmap, the contract, the generated task set, every finished task with its
  own files and its recorded evidence, every pause point, every plan change, and
  the immutable release record each land as a separate conventional commit whose
  subject is derived from canonical state. The command is local only — ALLOWED_GIT
  permits exactly rev-parse, status, add, and commit, so push, branch, and tag are
  unreachable by construction — and it stages only the explicit paths a checkpoint
  declares, with a pathspec on the commit, so a developer's unrelated staged work
  is never swept in. The new optional `commit_policy` defaults to `checkpoint`,
  which is the breaking change; `ultraship migrate` writes `off` into any workspace
  that omits the field, and an unmigrated workspace recording a pre-2.0
  framework_version resolves to `off` as well, so no existing project starts
  committing without being asked. Nothing was removed or renamed and the ten state
  schemas are unchanged, so a 1.x workspace's data is still valid data. This
  release was developed and completed using the feature it ships.
evidence:
  tests:
    - npm test — 254 passing, 0 failing across 23 files (227 before this release; 27 added)
    - node --test test/commit.test.mjs — 16 passing, covering policy resolution both ways, all five no-op paths, a real commit and its SHA, the absence of any attribution trailer, subject truncation, SemVer-ordered version derivation, a guard that refuses to commit an underived subject, and that an unrelated staged file stays uncommitted
    - node --test test/migrate.test.mjs — the 1.x upgrade path pins commit_policy to off, is idempotent on rerun, never downgrades an explicit checkpoint, and leaves a 1.x-shaped workspace passing validate before any migration
  builds:
    - No build step; pure ESM CLI with a vendored YAML parser and zero runtime dependencies. package.json gains no dependency field in this release.
  reviews: []
  deployments: []
  health_checks:
    - node bin/ultraship.mjs validate — exit 0, 18 files checked
    - node bin/ultraship.mjs migrate — run against this repository's live workspace; left the explicit commit_policy untouched and corrected a stale framework_version, proving the upgrade path on real state
    - "Scope gate — grep for push, branch, tag, remote, and fetch in lib/commit.mjs returns nothing, so the excluded outward-facing git operations are absent"
    - "Scope gate — git diff of schemas/ against main shows one file and four added lines, the optional commit_policy field and nothing else"
    - "Security gate — a secret-pattern scan of the full branch diff returns no matches"
known_limitations:
  - mode is release-ready, not published, even though the contract's target_mode is published. Per the maintainer's release-after-merge convention the GitHub release is created from the main merge commit, so `ultraship deploy` — which runs the declared published hook — is authorized only after this pull request merges. The record is pinned at completion time and cannot be amended afterwards, so the published mode reached post-merge is not reflected in evidence.deployments. This is the same shortfall 1.1.0 recorded.
  - This repository sets `commit_policy` explicitly rather than relying on the absent-field default, because its workspace recorded a pre-2.0 framework_version throughout development and an absent field would therefore have resolved to `off`. The default-on path is covered by tests rather than by this repository's own configuration.
  - The CI workflow is verified by running its exact steps locally; its green run on GitHub Actions is confirmed after the branch is pushed, not at release time.
  - A task whose `files` list in tasks.yaml is incomplete still produces a commit missing part of its implementation. The command reports what it staged so the gap is visible, but nothing detects it automatically.
  - No checkpoint commits the raw deploy evidence under `.ultraship/products/*/evidence/`, which is gitignored by design. The evidence that ships is what the release record states.
  - The first completion attempt was unwound. Running complete-release for real surfaced a defect — the version was derived only from active.yaml, which `transition RELEASED` archives before the checkpoint runs — so the record and its lock entry were rolled back, the defect fixed under T02, and completion redone. Nothing had been pushed or published at that point.
supersedes: 1.1.0
next_recommended_version: 2.1.0
immutable: true
