product: ultraship
version: 2.2.0
tasks:
  - id: US-ULTRASHIP-2.2.0-T01
    summary: Escape backslashes as well as pipes in the views table cell, and strengthen the test that missed it.
    why_required: >
      This is the only genuine defect in UltraShip's own code that the scan found. A canonical value
      containing a backslash before a pipe renders as a literal backslash followed by a
      cell-terminating pipe, so the generated Markdown table breaks. Without this the release fixes
      nothing that is actually wrong with the framework.
    status: done
    depends_on: []
    acceptance_criteria:
      - "`cell()` renders a value containing a literal backslash immediately before a pipe as an escaped backslash followed by an escaped pipe, so neither character terminates the Markdown cell"
      - "`cell()` still collapses whitespace runs to a single space and still returns the em dash for null, undefined, and the empty string, so no existing view output changes for values that contain neither meta-character"
      - test/views.test.mjs contains a fixture whose value includes `\|` and asserts the exact rendered escape sequence rather than matching any escaped pipe
      - The escape fix is a strict superset of the old behaviour for inputs containing no backslash, so no previously generated view is invalidated
    files:
      - lib/views.mjs
      - test/views.test.mjs
    evidence:
      - >
        cell() now escapes both meta-characters in one pass —
        String(value).replace(/\s+/g, ' ').trim().replace(/[\\|]/g, '\\$&') — so a backslash cannot
        re-expose the pipe it precedes. The whitespace collapse and the em-dash empty case are
        unchanged, and the comment above it records why the backslash is escaped too.
      - >
        Test-first proof — the strengthened test was written before the fix and failed against the
        old implementation with "workspace-brief.md must escape the backslash as well as the pipe",
        actual `... end to end \\| start to finish |`, expected /\\\\\\\|/. 9 tests, 8 pass, 1 fail.
      - node --test test/views.test.mjs after the fix — 9 passing, 0 failing
      - npm test — 274 passing, 0 failing (273 before this task; 1 added)
  - id: US-ULTRASHIP-2.2.0-T02
    summary: Declare a least-privilege GITHUB_TOKEN in the CI workflow.
    why_required: >
      With no permissions block the workflow inherits whatever the repository or organisation
      default is, which for anything created before February 2023 is read-write. The alert is a real
      weakness even though nothing in the workflow currently writes.
    status: done
    depends_on: []
    acceptance_criteria:
      - ".github/workflows/ci.yml declares `permissions: contents: read` and CI still passes on Node 20 and 22"
    files:
      - .github/workflows/ci.yml
    evidence:
      - >
        A top-level `permissions: contents: read` block added after `on:` and before `jobs:`, with a
        one-line comment stating it is least privilege regardless of the repository default. The
        triggers, the Node 20/22 matrix, the SHA-pinned actions, and the steps are unchanged.
      - >
        Parse check through the vendored YAML parser — permissions reads {"contents":"read"}, the
        job set is still ['test'], and the matrix is still {"node":[20,22]}.
      - npm test — 273 passing, 0 failing
      - node bin/ultraship.mjs validate — exit 0, 20 files checked
  - id: US-ULTRASHIP-2.2.0-T03
    summary: "Add a checked-in CodeQL workflow and a config that excludes vendor/. Deferred by US-ULTRASHIP-2.2.0-I02 — built correctly, pushed, and refused by the platform."
    why_required: >
      GitHub's default setup accepts no path filter, so while it is in force the vendored yaml copy
      cannot be excluded and keeps producing alerts against code this project does not own. Moving
      the scanner configuration into the repository is what makes the exclusion reviewable in a diff
      instead of a click in a web UI.
    status: deferred
    depends_on: []
    acceptance_criteria:
      - The repository contains no CodeQL workflow or config that cannot run, and no reference anywhere in the documentation to a file this release does not ship
    files:
      - .github/workflows/codeql.yml
      - .github/codeql/codeql-config.yml
    evidence:
      - >
        .github/codeql/codeql-config.yml sets paths-ignore to vendor/ and carries no queries key, so
        GitHub's default suite is kept. Its comment records why: vendor/ is unmodified third-party
        code upgraded by re-vendoring per vendor/README.md, never patched, so an alert there is not
        actionable in this repository.
      - >
        .github/workflows/codeql.yml runs on push to main, on pull requests, and weekly at cron
        '17 4 * * 1', matching the schedule default setup already used. Top-level permissions are
        contents: read, and the analyze job adds security-events: write, packages: read, and
        actions: read. The matrix is javascript-typescript and actions — javascript-typescript is
        the single identifier covering both JS and TS, so listing them separately would duplicate
        the analysis. fail-fast is false and each leg uploads under its own category so the two
        SARIF results do not overwrite each other. There is no install or build step, because the
        one dependency is vendored.
      - >
        Every action is pinned by full commit SHA with a version comment, matching ci.yml's
        convention. Resolved read-only — actions/checkout v7 is a lightweight tag at
        3d3c42e5aac5ba805825da76410c181273ba90b1, identical to the pin already in ci.yml;
        github/codeql-action v4 is an annotated tag at bce182f857edf1feab116e9795a3393d21977282
        which dereferences to commit f205ea1c3313d32999d8d6a48b4f6530d4437b38, used for both init
        and analyze.
      - "Both files parse through the vendored YAML parser, and grep of every `uses:` line shows three 40-hex SHAs"
      - npm test — 274 passing, 0 failing
      - >
        Outcome — both files were correct and both were refused. Pushed on pull request 17, run
        30657467790: each matrix leg completed its analysis and failed at the upload with "Code
        Scanning could not process the submitted SARIF file: CodeQL analyses from advanced
        configurations cannot be processed when the default setup is enabled". Default setup here is
        enforced by the organisation configuration zeroonething-org-config-1 and cannot be disabled
        with the available token scopes. Deferred by US-ULTRASHIP-2.2.0-I02; the files are removed by
        US-ULTRASHIP-2.2.0-T10, and SECURITY.md records the steps to adopt this mechanism later.
  - id: US-ULTRASHIP-2.2.0-T04
    summary: Write the vendored third-party code policy into SECURITY.md and CONTRIBUTING.md.
    why_required: >
      The exclusion is only honest if the reason is written down. Without it a reader cannot tell an
      accepted risk from an unattended one, which is the ownerless-fact failure the whole framework
      exists to prevent.
    status: done
    depends_on: []
    acceptance_criteria:
      - SECURITY.md, the contributor guidance, and CLAUDE.md each state that vendored third-party code is excluded from scanning, tracked by version, and answered by re-vendoring rather than patching
    files:
      - SECURITY.md
      - CONTRIBUTING.md
    evidence:
      - >
        SECURITY.md gains a "Vendored dependencies" section stating that vendor/ holds unmodified
        third-party code — today npm yaml at the exact published version, to keep the zero-install
        guarantee — that vendor/README.md documents the procedure, that the directory is excluded
        from code scanning by .github/codeql/codeql-config.yml because alerts against code the
        project cannot patch are not actionable, that it is tracked by pinned version instead, and
        that an advisory is answered by re-vendoring the fixed upstream release and rerunning
        npm test rather than editing anything under vendor/.
      - >
        CONTRIBUTING.md gains four lines beside its existing vendoring paragraph — never edit under
        vendor/, a dependency change means re-vendoring per vendor/README.md, and that is also why
        vendor/ is excluded from code scanning — pointing at SECURITY.md for the full policy rather
        than restating it.
      - >
        Every path, command, and version named was verified before being written — ls vendor/ shows
        yaml and README.md; vendor/yaml/package.json reads version 2.9.0; vendor/README.md:10 carries
        `npm pack yaml@2.9.0` and :12 records that browser/ and the source maps were removed and
        nothing was edited; .github/codeql/codeql-config.yml:7-8 carries paths-ignore with vendor/;
        package.json defines the test script; and vendor/yaml/browser does not exist, consistent with
        the documented procedure.
      - npm test — 274 passing, 0 failing; no documentation-shape test broke
  - id: US-ULTRASHIP-2.2.0-T05
    summary: Bring CLAUDE.md up to date and add the security-scanning and vendoring rule to it.
    why_required: >
      CLAUDE.md is what every future agent session reads before touching this repository. An agent
      that does not know vendor/ is off limits will eventually patch it and break the next
      re-vendor, which is the exact outcome the exclusion exists to prevent.
    status: done
    depends_on: []
    acceptance_criteria:
      - SECURITY.md, the contributor guidance, and CLAUDE.md each state that vendored third-party code is excluded from scanning, tracked by version, and answered by re-vendoring rather than patching
      - CLAUDE.md is accurate against the repository as it stands at 2.2.0 — every path, command, and count it names exists
    files:
      - CLAUDE.md
    evidence:
      - >
        Drift corrected against the repository — "five skills" became five lifecycle skills plus the
        eight supporting ones named individually, with subagent's own contract at
        shared/subagent-protocol.md; "the ten CLI commands" became twelve; "UltraShip 1.0 has a
        frozen contract" became 2.x; the lib/*.mjs dispatcher list gained commit and wave; the
        shared/ list gained commit-protocol.md and subagent-protocol.md; and the network-guarantee
        citation was repinned from README.md:50 to README.md:60, where that sentence now lives.
      - >
        A vendoring rule added to Conventions — vendor/ is never edited, it is unmodified npm yaml
        2.9.0, upgrading means re-vendoring with npm pack and rerunning npm test per
        vendor/README.md, .github/codeql/codeql-config.yml sets paths-ignore vendor/ for that reason,
        an advisory is answered by re-vendoring, and SECURITY.md holds the full policy.
      - >
        Every claim proved rather than asserted — ls skills/ returns exactly the 13 named files;
        the COMMANDS object in bin/ultraship.mjs has 12 keys and docs/CONTRACT.md's command table has
        12 rows; ls schemas/ returns 10, so "ten schemas" stands; every named lib/ module exists;
        sed -n '60p' README.md carries the network sentence; and node bin/ultraship.mjs state and
        validate both exit 0.
      - npm test — 274 passing; node --test test/validate.test.mjs — 22 passing; --test-name-pattern="migrate" — 40 passing
      - >
        Flagged out of scope for this task and picked up by US-ULTRASHIP-2.2.0-T09 — SECURITY.md
        still says security fixes are released against the latest 1.x while the contract is 2.x.
  - id: US-ULTRASHIP-2.2.0-T06
    summary: Bump every declared version file to 2.2.0 and record the release in the changelog and compatibility policy.
    why_required: >
      validate holds every file in version_files to the greatest released version, so the release
      cannot complete without this. The compatibility entry is what tells an adopter that 2.2.0 owes
      them no migration and no deprecation window.
    status: done
    depends_on:
      - US-ULTRASHIP-2.2.0-T01
      - US-ULTRASHIP-2.2.0-T02
      - US-ULTRASHIP-2.2.0-T03
      - US-ULTRASHIP-2.2.0-T04
      - US-ULTRASHIP-2.2.0-T05
    acceptance_criteria:
      - version_files (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) all read 2.2.0 at release
      - No CLI command, skill, schema, or canonical field is added, removed, renamed, or reshaped, so a 2.1.0 workspace is valid on 2.2.0 with no migration beyond framework_version
      - "`ultraship migrate` remains forward-only and idempotent"
    files:
      - package.json
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - CHANGELOG.md
      - docs/COMPATIBILITY.md
    evidence:
      - >
        All three declared version files read 2.2.0, checked against the key paths ultraship.yaml
        actually declares rather than assumed — package.json version, .claude-plugin/plugin.json
        version, and .claude-plugin/marketplace.json plugins.0.version all print 2.2.0.
      - >
        CHANGELOG.md gains a "[2.2.0] — 2026-08-01" entry in the existing house structure — a lead
        paragraph plus Fixed, Added, Changed, and Compatibility sections — covering the cell()
        escape fix and its strengthened test, the two new code-scanning files and the vendor/
        exclusion, the ci.yml permissions block, and the CLAUDE.md audit. The file's link-reference
        block holds only 0.2.0 and 0.1.0 and no entry since has added one, so 2.2.0 adds none either.
      - >
        docs/COMPATIBILITY.md gains a "What changed in 2.2" section above the 2.1 one, stating that
        nothing broke, that no command, skill, schema, or field was removed or renamed, that
        schema_version stays 1 and a 2.1.0 workspace passes validate on 2.2 unchanged, that no
        deprecation window is owed, that cell() is a module-private helper CONTRACT.md does not
        freeze, and that migrate carries the version line and nothing else.
      - >
        node bin/ultraship.mjs validate — exit 1 with exactly the three expected version_files
        complaints, each saying 2.2.0 disagrees with the release version 2.1.0. This is the designed
        gate: the bump is only reconciled when /ultraship:complete writes the 2.2.0 release record.
      - npm test — 274 passing, 0 failing
