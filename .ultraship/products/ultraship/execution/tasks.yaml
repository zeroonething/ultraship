product: ultraship
version: 2.1.0
tasks:
  - id: US-ULTRASHIP-2.1.0-T01
    summary: Add lib/wave.mjs and the twelfth CLI command, ultraship wave, with its test file.
    why_required: >
      The wave is the only mechanical part of this release. Without a deterministic, CLI-computed
      dispatchable set, the subagent skill would be asking an agent to decide which tasks are safe
      to run at once, which is exactly the guessing the framework exists to replace.
    status: done
    depends_on: []
    acceptance_criteria:
      - "`ultraship wave [product] [version]` prints JSON naming the dispatchable task ids and, for every task not in the wave, the reason it was excluded"
      - "A task is admitted to the wave only when its status is `todo`, every id in `depends_on` has status `done`, and its `files` are disjoint from those of every task already in the wave and every task whose status is `in-progress`"
      - "Two independent runs of `ultraship wave` against the same unchanged tasks.yaml return the same wave in the same order, ties broken by ascending task id"
      - "`ultraship wave` returns an empty wave with a reason per task when every remaining task is blocked, and an empty wave when every task is `done`; it exits non-zero when there is no active release or no tasks file"
      - No `.ultraship/...` path is hardcoded in lib/wave.mjs; every path is derived from `paths(root)`
      - No runtime npm dependency is added; lib/wave.mjs uses Node 20+ stdlib and the vendored YAML parser through lib/yaml.mjs
    files:
      - lib/wave.mjs
      - bin/ultraship.mjs
      - test/wave.test.mjs
    evidence:
      - node --test test/wave.test.mjs — 17 passing, 0 failing
      - >
        Covers dependency gating, dependencies that are deferred or blocked, a dependency id
        matching no task, file-overlap holding, an in-progress task holding its files, a task
        declaring no files running alone, a reported dependency cycle, the all-blocked and all-done
        empty waves, deterministic ordering across two runs, and the four CLI paths including both
        non-zero exits.
      - >
        node bin/ultraship.mjs wave — run against this repository's live 2.1.0 task set; admitted
        T01, T02, and T06 and named the unmet dependency for each of the other five.
      - >
        Scope gate — a test reads lib/wave.mjs and asserts it references no child_process, fetch,
        http, spawn, or exec, so the module computes and never dispatches.
      - >
        Scope gate — lib/wave.mjs derives every path from paths(root) and imports YAML only through
        lib/yaml.mjs; no .ultraship path is hardcoded and no dependency was added.

  - id: US-ULTRASHIP-2.1.0-T02
    summary: Write shared/subagent-protocol.md as the single contract every skill reads.
    why_required: >
      Six skill files must obey the same activation, brief, return, and prohibition rules. Written
      once here they stay one contract; restated per skill they drift, which is the failure
      CLAUDE.md names for shared prose contracts.
    status: done
    depends_on: []
    acceptance_criteria:
      - "shared/subagent-protocol.md states the three activation paths, their precedence order, the brief format, the required return format, and the four prohibitions, and skills/plan and skills/develop reference it rather than restating it"
      - "A subagent writes no file under .ultraship/ and runs no `ultraship transition`, `ultraship commit`, or `ultraship deploy`; the protocol states this and the calling skill performs all four"
      - "`allow_parallel_agents: true` in .ultraship/ultraship.yaml activates the skill with no further instruction, which is how a developer makes parallel work their default"
      - The release reports no token, dollar, or time figure for parallel execution, because none is measured
    files:
      - shared/subagent-protocol.md
    evidence:
      - >
        shared/subagent-protocol.md written — states the three activation paths, a precedence table
        that resolves any two disagreeing signals, the announce-before-dispatch rule, the two
        dispatch modes, the brief, the return shape, the four prohibitions, and who records and
        commits.
      - >
        The four prohibitions are stated as a numbered list — no write under .ultraship/, no
        ultraship transition, no ultraship commit, no ultraship deploy — each with the reason, and
        the calling skill is named as the party that performs all four.
      - >
        The honesty section forbids reporting any token, dollar, or time figure for parallel
        execution and requires saying so plainly when the host tool cannot dispatch concurrently.
      - >
        The plan and develop references that complete this criterion are written under T05 and T04
        and are verified together at T08.

  - id: US-ULTRASHIP-2.1.0-T03
    summary: Write skills/subagent/SKILL.md, the sixth skill, as a supporting skill.
    why_required: >
      This is the release's user-facing surface. Without it there is no `/ultraship:subagent` to
      invoke and the first of the three activation paths does not exist.
    status: done
    depends_on:
      - US-ULTRASHIP-2.1.0-T02
    acceptance_criteria:
      - "skills/subagent/SKILL.md exists, carries the standard name and description frontmatter, and is invocable as `/ultraship:subagent`"
      - "An explicit in-session instruction to use subagents activates the skill even when `allow_parallel_agents` is false, and the skill names that instruction as the activation source before dispatching"
      - "The skill announces the matched activation source and the number of agents it is about to dispatch before dispatching any of them"
    files:
      - skills/subagent/SKILL.md
    evidence:
      - >
        skills/subagent/SKILL.md written with the standard name and description frontmatter, so it
        is invocable as /ultraship:subagent and discoverable the same way the other eleven skills
        are.
      - >
        Step 1 states that a recorded allow_parallel_agents false does not override someone asking
        for parallel work in this session, and that the developer is the higher authority in both
        directions.
      - >
        Step 3 requires naming the authorising signal and the agent count before the first agent
        starts, and carries a worked example of that announcement.
      - >
        The skill declares it owns no file under .ultraship/ and writes none; the "What this skill
        owns" section names the calling skill as the party that records, sets status, and commits.
      - >
        It defers to shared/subagent-protocol.md for activation, precedence, the brief, the return
        shape, and the four prohibitions rather than restating them, so there is one contract.
      - >
        Guardrails forbid dispatching on the skill's own initiative, computing a wave set itself,
        reporting any unmeasured figure, fabricating a dispatch the host cannot make, and marking a
        task done.

  - id: US-ULTRASHIP-2.1.0-T04
    summary: Wire the develop skill to compute waves, dispatch them, and check returned files.
    why_required: >
      Develop generates the independent work this release exists to parallelise. Without the
      wiring the wave command has no caller and the outcome is unreachable.
    status: todo
    depends_on:
      - US-ULTRASHIP-2.1.0-T01
      - US-ULTRASHIP-2.1.0-T03
    acceptance_criteria:
      - "With none of the three activation signals present, `/ultraship:develop` produces the same sequential behaviour as 2.0.0 and dispatches no subagent"
      - "Develop records each subagent's returned evidence against that subagent's own task in tasks.yaml and runs `ultraship commit develop-task --task <id>` per finished task, so the existing commit protocol is unchanged"
      - "Develop halts the run and reports rather than computing another wave when a subagent returns a changed file that was not in that task's declared `files`"
    files:
      - skills/develop/SKILL.md
    evidence: []

  - id: US-ULTRASHIP-2.1.0-T05
    summary: Reference the protocol from plan, and from brainstorm, iterate, and complete.
    why_required: >
      The contract promises the skill is reachable from all five workflow skills, with plan able to
      hand out independent research briefs. A skill only develop can reach is half the release.
    status: todo
    depends_on:
      - US-ULTRASHIP-2.1.0-T03
    acceptance_criteria:
      - The CLI still calls no model and touches no network — `ultraship wave` reads local YAML and prints JSON, and every dispatch decision is made by the agent, not the CLI
      - No command, skill, schema, or field is removed or renamed; a 2.0.0 workspace passes `ultraship validate` unchanged on 2.1.0, so this is a minor release owing no deprecation window under docs/COMPATIBILITY.md
    files:
      - skills/plan/SKILL.md
      - skills/brainstorm/SKILL.md
      - skills/iterate/SKILL.md
      - skills/complete/SKILL.md
    evidence: []

  - id: US-ULTRASHIP-2.1.0-T06
    summary: Add the migrate step carrying a 2.0.0 workspace to framework_version 2.1.0.
    why_required: >
      migrate must stay forward-only and idempotent for every released version. A 2.1.0 that no
      workspace can be carried up to breaks the guarantee docs/CONTRACT.md makes.
    status: done
    depends_on: []
    acceptance_criteria:
      - "`ultraship migrate` carries a 2.0.0 workspace to framework_version 2.1.0, adds no field, and changes nothing when rerun"
      - "`ultraship migrate` remains forward-only and idempotent"
    files:
      - test/migrate.test.mjs
    evidence:
      - node --test test/migrate.test.mjs — 12 passing, 0 failing (10 before this task; 2 added)
      - >
        No new code was needed. lib/migrate.mjs already syncs framework_version to
        FRAMEWORK_VERSION, and FRAMEWORK_VERSION is read from package.json rather than being a
        literal, so bumping the version file under T08 is the whole 2.1 upgrade step. This task's
        declared files were corrected from lib/migrate.mjs and test/migrate.test.mjs to
        test/migrate.test.mjs alone, so the record states what actually changed.
      - >
        The new test writes a 2.0.0-shaped workspace, runs migrate, and asserts framework_version
        moves to the installed version while the sorted key set of ultraship.yaml is byte-identical
        before and after — so no field was added — then reruns migrate and asserts all three sync
        results report changed false and the key set is still identical.
      - >
        A second test asserts a 2.0.0-shaped workspace passes validateWorkspace before any
        migration, which is the no-break guarantee docs/CONTRACT.md makes for a minor release.

  - id: US-ULTRASHIP-2.1.0-T07
    summary: Update CONTRACT, COMPATIBILITY, README, and CHANGELOG for twelve commands and the sixth skill.
    why_required: >
      The public contract is enumerated by hand in docs/CONTRACT.md. A command and a skill that
      ship without appearing there are outside the contract and unsupported by definition.
    status: todo
    depends_on:
      - US-ULTRASHIP-2.1.0-T01
      - US-ULTRASHIP-2.1.0-T03
    acceptance_criteria:
      - "docs/CONTRACT.md lists twelve CLI commands including `ultraship wave` and names `subagent` among the supporting skills"
      - README, CHANGELOG.md, docs/CONTRACT.md, and docs/COMPATIBILITY.md describe the skill and the command accurately, and every path and command they name exists
    files:
      - docs/CONTRACT.md
      - docs/COMPATIBILITY.md
      - README.md
      - CHANGELOG.md
    evidence: []

  - id: US-ULTRASHIP-2.1.0-T08
    summary: Bump every declared version file to 2.1.0 and run the full suite and validate.
    why_required: >
      validate holds every file in version_files to the greatest released version, so the release
      cannot complete until they all read 2.1.0. This is the release's own gate.
    status: todo
    depends_on:
      - US-ULTRASHIP-2.1.0-T01
      - US-ULTRASHIP-2.1.0-T02
      - US-ULTRASHIP-2.1.0-T03
      - US-ULTRASHIP-2.1.0-T04
      - US-ULTRASHIP-2.1.0-T05
      - US-ULTRASHIP-2.1.0-T06
      - US-ULTRASHIP-2.1.0-T07
    acceptance_criteria:
      - "`npm test` passes locally and in CI, including test/wave.test.mjs and the migrate test for the 2.0.0 to 2.1.0 step"
      - "`node bin/ultraship.mjs validate` exits 0 on this workspace"
      - version_files (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) all read 2.1.0 at release
    files:
      - package.json
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
    evidence: []
