    why_required: >
      Rewritten by US-ULTRASHIP-2.2.0-I02. The path filter this release planned cannot be applied
      here, so the dismissal is the only mechanism left. A dismissal with no stated reason is exactly
      the ownerless fact this release exists to remove, so each one carries its reason.
    status: todo
    depends_on:
      - US-ULTRASHIP-2.2.0-T10
    acceptance_criteria:
      - Each of the four js/polynomial-redos alerts is dismissed with a comment naming vendor/yaml as an unmodified copy of npm yaml 2.9.0 and pointing at SECURITY.md
      - "`gh api repos/zeroonething/ultraship/code-scanning/alerts --jq '[.[] | select(.state == \"open\")] | length'` returns 0 after that run"
    files: []
    evidence: []
  - id: US-ULTRASHIP-2.2.0-T08
