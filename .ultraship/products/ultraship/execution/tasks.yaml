  - id: US-ULTRASHIP-2.2.0-T09
    summary: Audit and correct README.md and the docs/ set against the repository at 2.2.0.
    why_required: >
      Added by US-ULTRASHIP-2.2.0-I01. The CLAUDE.md audit found that the repository's own
      instruction file described five skills and ten CLI commands when 2.1.0 had already shipped
      thirteen skills and twelve commands, and flagged that SECURITY.md still promises fixes against
      the latest 1.x. README.md is the more widely read of the two surfaces and had no owner in this
      release, so shipping the CLAUDE.md fix alone would leave the same drift where more people see
      it. This release also adds two files a reader has to be told about and a policy they have to
      be able to find.
    status: done
    depends_on:
      - US-ULTRASHIP-2.2.0-T04
      - US-ULTRASHIP-2.2.0-T05
    acceptance_criteria:
      - README.md and every file under docs/ is accurate against the repository as it stands at 2.2.0 — every command, count, path, and version they name exists — and README.md describes the code-scanning setup and the vendored-code policy
    files:
      - README.md
      - SECURITY.md
      - docs/CONTRACT.md
      - docs/CONTRIBUTING-WITH-ULTRASHIP.md
    evidence:
      - >
        Four real drifts found and corrected. README.md carried a 2.0.0 version badge and said
        UltraShip "provides five skills" when ls skills/ returns 13; both fixed, the second to "five
        lifecycle skills". SECURITY.md promised that security fixes are released against the latest
        1.x, with a supported-versions table to match, while the greatest released version is 2.1.0
        and the contract is 2.x; the prose and every table row were corrected. docs/CONTRACT.md
        claimed ultraship migrate carries any earlier workspace "to 2.0" when lib/migrate.mjs syncs
        framework_version to the installed release; corrected to "to the installed version".
        docs/CONTRIBUTING-WITH-ULTRASHIP.md said "the five skills" in two places while itself
        invoking a supporting skill; both corrected.
      - >
        README.md gained a paragraph in its Contributing section covering what this release adds —
        code scanning configured in the repository at .github/workflows/codeql.yml with
        .github/codeql/codeql-config.yml setting paths-ignore vendor/, and the vendored-code rule —
        pointing at SECURITY.md for the full policy rather than duplicating it.
      - >
        Everything else was verified accurate and left alone — the README command table covers all
        twelve commands the CLI's own error output lists; "twelve CLI commands" and "ten schemas"
        match the COMMANDS object and ls schemas/; lib/commit.mjs really does permit exactly four git
        subcommands; DEFAULT_COMMIT_POLICY is checkpoint and migrate writes off; every link target in
        all four files exists; docs/CONTRACT.md's twelve command rows, thirteen skills, and ten
        schema rows all match the directories; and the semver, state, and wave commands shown in code
        blocks were run and exited 0.
      - >
        Commands that write under .ultraship/ or run the release hook — init, migrate, views, deploy,
        transition, commit, constraints set — were deliberately not executed under the subagent
        prohibitions; their existence and usage strings were proved from the COMMANDS object and from
        safe usage-error paths instead.
      - npm test — 274 passing, 0 failing, including the documentation-shape tests that assert the README names all twelve commands and all five lifecycle skills
      - >
        node bin/ultraship.mjs validate — the same three expected version_files complaints as T06 and
        nothing else, identical before and after these edits against a captured baseline.
  - id: US-ULTRASHIP-2.2.0-T10
    summary: Remove the CodeQL workflow and config that cannot run, and correct every reference to them.
    why_required: >
      Added by US-ULTRASHIP-2.2.0-I02. The two files fail on every pull request here, and a check
      that is expected to be red teaches a reviewer to ignore red checks. Six documents already cite
      them as the mechanism, so deleting the files without correcting the prose would leave the
      repository describing a setup it does not have — the drift this release was created to fix.
    status: done
    depends_on: []
    acceptance_criteria:
      - The repository contains no CodeQL workflow or config that cannot run, and no reference anywhere in the documentation to a file this release does not ship
      - SECURITY.md states why the exclusion is a dismissal rather than a path filter, and the steps to adopt the stronger mechanism if the organisation configuration changes
    files:
      - .github/workflows/codeql.yml
      - .github/codeql/codeql-config.yml
      - SECURITY.md
      - CONTRIBUTING.md
      - CLAUDE.md
      - README.md
      - CHANGELOG.md
      - docs/COMPATIBILITY.md
    evidence:
      - >
        Both files removed with git rm and the now-empty .github/codeql/ directory is gone;
        .github/workflows/ holds ci.yml alone. No disabled or workflow_dispatch-only stub was left
        behind, because a workflow that cannot work is worse than none.
      - >
        SECURITY.md gains a "How the exclusion is currently carried" subsection: each alert raised
        inside vendor/ is dismissed through the code-scanning API with a comment naming vendor/yaml
        as an unmodified copy of npm yaml 2.9.0 and pointing back at the policy; it is a dismissal
        rather than a path filter because GitHub rejects an advanced-configuration SARIF while
        default setup is enabled and the API refuses to disable default setup with HTTP 422, the
        setting being controlled by organisation administrators; the trade-off is stated plainly —
        a dismissal lives in GitHub's alert store, not in the diff, which is why the reason is
        written down; and the three steps to the stronger mechanism are listed, detach from the
        organisation configuration, disable default setup, add a workflow whose config carries
        paths-ignore for vendor/. The vendoring policy itself is unchanged.
      - >
        Every reference to the two deleted files corrected — CLAUDE.md, CONTRIBUTING.md, and
        README.md now say vendor/ is excluded and point at SECURITY.md for how; the CHANGELOG's
        2.2.0 Added bullet describes the dismissals instead of the workflow; and
        docs/COMPATIBILITY.md's "What changed in 2.2" no longer claims a checked-in scanning
        workflow. The agent also caught and corrected the 2.2.0 entry's opening paragraph, which
        asserted the deleted mechanism outside the bullet it was asked to fix.
      - >
        grep for codeql and paths-ignore across all Markdown returns three hits, all of them prose
        about the mechanism that could not be used — the CHANGELOG's "why not", SECURITY.md's step
        three, and the derived active-releases view. No hit names either deleted file.
      - npm test — 274 passing, 0 failing
      - >
        node bin/ultraship.mjs validate — the same three expected version_files complaints and
        nothing else.
