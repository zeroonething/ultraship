product: ultraship
version: 2.0.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: high
  reasons:
    - The repository has no recorded constraints — ultraship state reports active.constraints as
      absent and none were set with ultraship constraints set — so this assessment is grounded in
      repository condition rather than in a time or budget limit the user supplied.
    - Every seam this release needs already exists. lib/deploy.mjs already spawns subprocesses with
      spawnSync and captures their output, so a git-invoking module follows an established pattern
      rather than inventing one. lib/migrate.mjs already carries a framework_version sync step and
      documents where a new step goes. lib/paths.mjs already derives every canonical path a
      checkpoint must stage.
    - The change is additive at the code level. One new lib module, one new dispatcher entry, one
      new optional schema field, one migrate guard, four skill files, and documentation. Nothing is
      removed or restructured.
    - Test coverage is strong (227 passing across 22 files) and test/deploy.test.mjs already
      demonstrates how to test a subprocess-spawning module without polluting the repository.
    - The one genuinely uncertain design question — whether schema_version moves to 2 — was resolved
      during the fit assessment in favour of keeping it at 1, using the already-recorded
      framework_version as the upgrade guard instead. That removes the only change that would have
      broken an existing workspace's validate.
  major_cost_drivers:
    - Exhaustive no-op coverage for the commit command; a spurious failure in a git-touching command
      would block every skill, so the absent-policy, off-policy, no-changes, no-git-repository, and
      git-not-on-PATH paths all need tests
    - Testing git behaviour in temporary repositories without leaving state behind or ever
      committing to this repository during a test run
    - Restating docs/CONTRACT.md and docs/COMPATIBILITY.md for a 2.0 contract without losing the
      precision the 1.0 versions have
  recommended_scope_change: null
