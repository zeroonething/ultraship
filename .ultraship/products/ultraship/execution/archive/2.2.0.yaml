version: 2.2.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: high
  reasons:
    - >
      The recorded resource preferences are minimize_cost true and allow_additional_spend false, and
      this release is the cheapest kind UltraShip plans — one line of library code, one strengthened
      test, two workflow-side files, and documentation. Nothing here needs design work.
    - >
      The one code defect is confirmed at a single site. lib/views.mjs is the only Markdown-emitting
      module in lib/, so there is no sibling caller to find and no call-graph to trace.
    - >
      The research it depended on is already done: the vendored yaml copy is on the newest published
      version, upstream carries the same regexes unchanged, and no advisory covers them, so the
      excluded option of upgrading or patching vendor/ is settled rather than open.
    - >
      allow_parallel_agents is false in the recorded preferences, but the developer instructed this
      session to use subagents, which takes precedence under shared/subagent-protocol.md. Five of
      the eight tasks touch disjoint files and can be dispatched as one wave.
  major_cost_drivers:
    - >
      The CodeQL advanced workflow, which cannot be verified locally — it needs a real run on GitHub
      after default setup is disabled, and default setup being enabled makes an advanced workflow
      fail rather than warn.
    - >
      Auditing CLAUDE.md against the repository rather than appending to it, which means checking
      every path, command, and count it names.
  recommended_scope_change: null
