id: US-ULTRASHIP-2.2.0-I01
timestamp: 2026-07-31T18:50:44Z
category:
  - release-level
  - task-level
trigger: >
  The developer instructed, mid-release, that the README be written properly and the overall docs
  kept up to date. The contract as planned touched documentation only where the security work forced
  it — a CHANGELOG entry and a COMPATIBILITY entry — and explicitly left docs/CONTRACT.md unchanged.
  README.md was not in scope at all.
evidence:
  - >
    The developer's in-session instruction, given after T04 was committed — "Also write the readme
    properly and keep the overall docs up-to-date". It is a scope addition, not a clarification of
    anything the contract already said.
  - >
    The same drift the CLAUDE.md task was created to fix exists in the shipped documentation. CLAUDE.md
    described five skills and ten CLI commands when 2.1.0 had already added a sixth supporting skill
    and a twelfth command, and nothing in the release checked whether README.md and docs/ carry the
    same stale counts. A repository whose instruction file was audited while its README was not would
    leave the more widely read of the two wrong.
  - >
    This release adds two files a reader has to be told about — .github/workflows/codeql.yml and
    .github/codeql/codeql-config.yml — and a policy written into SECURITY.md and CONTRIBUTING.md.
    README.md is where a reader looks first and would find no mention of either.
before:
  scope:
    - "Documentation — docs/COMPATIBILITY.md records 2.2.0 as a fix-only release owing no deprecation, CHANGELOG.md gains a 2.2.0 entry, and docs/CONTRACT.md is checked and left unchanged because nothing on the frozen surface moves"
  assumptions:
    - >
      A security release touches documentation only where the security change forces it, so README.md
      and docs/CONTRACT.md need no work beyond a correctness check.
    - >
      CLAUDE.md was the only instruction surface at risk of drift, because it is the one an agent
      reads before acting.
  implementation: >
    One documentation task, T06, bundling the version-file bump with a CHANGELOG entry and a
    COMPATIBILITY entry. No task owned README.md or docs/CONTRACT.md.
change:
  summary: >
    Widen the documentation scope from the two files the security work forces to the whole
    user-facing set, and give it its own task. README.md and every file under docs/ are audited
    against the repository as it stands at 2.2.0 — every command, count, path, and version they name
    must exist — and the security-scanning and vendored-code policy is reflected where a reader would
    look for it. The same accuracy standard already accepted for CLAUDE.md now applies to them.
  added:
    - "README.md audited and corrected against the repository at 2.2.0, and extended to cover code scanning and the vendored-code policy where a reader would look for it"
    - "docs/CONTRACT.md and docs/CONTRIBUTING-WITH-ULTRASHIP.md audited against the repository at 2.2.0 — every command, count, path, and version they name must exist"
    - "A ninth task, US-ULTRASHIP-2.2.0-T09, owning README.md and the docs/ audit, so the documentation sweep is committed and reviewable on its own rather than riding inside the version bump"
  removed: []
  deferred: []
  replaced:
    - "The contract's docs line — docs/CONTRACT.md is no longer merely `checked and left unchanged`; it is audited and corrected if the audit finds drift"
impact:
  products:
    - ultraship
  versions:
    - 2.2.0
  tasks:
    - US-ULTRASHIP-2.2.0-T06
    - US-ULTRASHIP-2.2.0-T08
    - US-ULTRASHIP-2.2.0-T09
  dependencies: []
  resource_effect: >
    Adds one task to a release of eight. The work is reading and correcting prose against commands
    that already exist, with no new code and no new test, so it does not change the release-fit
    assessment of high. The recorded preference minimize_cost is respected: the audit is scoped to
    files that are already in the repository, not to new documentation.
versioning:
  previous_target: 2.2.0
  new_target: 2.2.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    In-session instruction from the developer on 2026-07-31, during the 2.2.0 development phase,
    following an earlier instruction in the same session to keep CLAUDE.md up to date.
canonical_updates:
  - products/ultraship/releases/2.2.0.yaml
  - products/ultraship/execution/tasks.yaml
