name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, matching what code scanning default setup ran: a query published
    # after a merge still gets a pass over unchanged code.
    - cron: '17 4 * * 1'

# Least privilege for GITHUB_TOKEN regardless of the repository default.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript is the single modern identifier covering both
        # JS and TS; listing them separately would duplicate the analysis.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      # No install or build step: the one dependency (yaml) is vendored under
      # vendor/, and CodeQL's JavaScript analysis needs no build.
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:${{ matrix.language }}
