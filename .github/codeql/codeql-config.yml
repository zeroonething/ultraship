name: UltraShip CodeQL config

# vendor/ is unmodified third-party code (currently yaml 2.9.0, obtained with
# `npm pack`). Per vendor/README.md it is upgraded by re-vendoring, never
# patched in place, so alerts against it are not actionable here — they belong
# upstream. Excluding it keeps code scanning pointed at code we can fix.
paths-ignore:
  - vendor/

# No `queries:` key on purpose: keep GitHub's default query suite.
